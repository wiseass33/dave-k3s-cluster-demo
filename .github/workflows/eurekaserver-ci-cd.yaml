name: Eureka Server CICD Workflow .
run-name: eurekaserver Pipeline
on:
  workflow_dispatch:  

jobs:
  get_runners_details:
    name: Fetch Runner Details
    uses: wiseass33/dave-k3s-cluster-demo/.github/workflows/fetch_runner_details.yaml@development
    secrets: inherit

  build-package:
    needs: [get_runners_details]
    uses: wiseass33/dave-k3s-cluster-demo/.github/workflows/maven-build-package-ci.yaml@development
    with:
      runner_name: ${{ needs.get_runners_details.outputs.runner_dev }}
      needs_docker_push: true
      needs_maven_build: true
      env_vars_file: platformeurekaserver
      maven_phases: clean package
      maven_properties: -DskipTests=true
    secrets: inherit  
