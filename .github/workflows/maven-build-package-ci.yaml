name: CI - Multi Stage Workflow
# TASKS IN THIS WORKFLOW - MAVEN BUILD, MAKE A DOCKER IMAGE, PUSH TO ARTIFACTORY

on:
  workflow_call:
    inputs:
      runner_name:
        required: true
        type: string
      needs_maven_build:
        required: false
        type: boolean
      needs_docker_push:
        required: false
        type: boolean
      env_vars_file:
        required: true
        type: string
      maven_phases:
        required: false
        type: string
      maven_properties:
        required: false
        type: string
      build_args:
        required: false
        type: string
    outputs:
      IMAGE_TAG:
        description: "Image TAG value"
        value: ${{ jobs.setup.outputs.IMAGE_TAG }}

jobs:
  setup:
    runs-on: ${{ inputs.runner_name }}
    outputs:
      BUILD_NUMBER: ${{ steps.Init.outputs.BUILD_NUMBER }}
      IMAGE_TAG: ${{ steps.tag.outputs.IMAGE_TAG }}
      IMAGE_NAME: ${{ steps.tag.outputs.IMAGE_NAME }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: DotEnv action variables
        uses: xom9ikk/dotenv@v2.3.0
        with:
          path: ./ghactions-envvars
          mode: ${{ inputs.env_vars_file }}
      - name: Initialize Variables
        id: Init
        run: |
          echo date=$(date +'%Y%m%d')
          echo date=$(date +'%Y%m%d') >> $GITHUB_ENV
          BUILD_NUMBER=$(( ${{ github.run_number}} + 500 ))
          echo "Build Number to append to ${{ env.Version }} is:"$BUILD_NUMBER
          echo BUILD_NUMBER=$BUILD_NUMBER >> $GITHUB_ENV
          echo BUILD_NUMBER=$BUILD_NUMBER >> $GITHUB_OUTPUT
          echo GITHUB_SHA=$( git log -1 --format=format:%h --full-diff ${{ env.PROJECT_FOLDER_NAME }})
          echo GITHUB_SHA=$(  git log -1 --format=format:%h --full-diff ${{ env.PROJECT_FOLDER_NAME }}) >> $GITHUB_ENV
      - name: Generate Image Tag Values
        id: tag
        run: |
          echo IMAGE_TAG="${{ env.Version }}.${{ env.BUILD_NUMBER}}-${{ env.date }}-${{ env.GITHUB_SHA }}"
          echo IMAGE_TAG="${{ env.Version }}.${{ env.BUILD_NUMBER}}-${{ env.date }}-${{ env.GITHUB_SHA }}" >> $GITHUB_OUTPUT

  build-artifacts:
    name: Maven Build
    runs-on: ${{ inputs.runner_name }}
    needs: [setup]
    if: always ()
    permissions:
      contents: 'write'
      pull-requests: 'write'
      id-token: 'write'
    steps:
      - name: Print GitHub Actor
        run: echo "The GitHub actor or current user is ${{ github.actor }}"
      - name: Checkout
        uses: actions/checkout@v4
      - name: DotEnv action variables
        uses: xom9ikk/dotenv@v2.3.0
        with:
          path: ./ghactions-envvars
          mode: ${{ inputs.env_vars_file }}
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin' 
          java-version: ${{ env.JAVA_VERSION }}
      - name: Set up Maven
        uses: stCarolas/setup-maven@v5
        with:
         maven-version: ${{ env.MAVEN_VERSION }}
      - name: Configure Git user
        run: |
          git config user.email "actions@github.com"
          git config user.name "GitHub Actions" 
      - name: Maven build
        if: ${{ inputs.needs_maven_build }}
        run: |
          mvn -version
          mvn -B -f ${{ env.PROJECT_FOLDER_NAME }}/pom.xml \
                 -s ${{ env.PROJECT_FOLDER_NAME }}/settings.xml \
                  ${{ inputs.maven_properties }} \
                  ${{ inputs.maven_phases }} 
        env:
          BUILD_NUMBER: ${{ needs.setup.outputs.BUILD_NUMBER }}
          ARTIFACTORY_USER: ${{ github.actor }}
          ARTIFACTORY_PWD: ${{ secrets.REPOSITORY_TOKEN }}
      # - name: Set up Docker Buildx
      #   if: ${{ inputs.needs_docker_push }}
      #   uses: docker/setup-buildx-action@v3
      - name: DEBUG - List all files in the "target" directory
        run: ls -l ${{ env.PROJECT_FOLDER_NAME }}/target
      - name: Login to Docker Hub
        if: ${{ inputs.needs_docker_push }}
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.REPOSITORY_TOKEN }}
      - name: Build and push
        if: ${{ inputs.needs_docker_push }}
        uses: docker/build-push-action@v6        
        with:
          context: ${{ env.PROJECT_FOLDER_NAME }}
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.REGISTRY_REPO }}/${{ env.IMAGE_NAME }}:${{ needs.setup.outputs.IMAGE_TAG }}
          file: ${{ env.PROJECT_FOLDER_NAME }}/Dockerfile
          build-args: ${{ inputs.build_args }}