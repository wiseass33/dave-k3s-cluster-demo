{{- if not (lookup "v1" "Service" $.Values.nameSpace $.Values.service.propsWebhookName) }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.service.propsWebhookName }}
spec:
  type: NodePort  # Or LoadBalancer if using a cloud provider
  selector:
    app: configserver
  ports:
    - protocol: TCP
      port: 8888
      targetPort: 8888
      nodePort: 30888
